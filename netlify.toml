# Netlify builds and publishes the app on every push to main.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Both values are public: they ship inside the app's JavaScript anyway.
  # Row-level security in the database is what protects the data.
  VITE_SUPABASE_URL = "https://qjljcmnwzyldbfbvixfz.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_g_HXijhEhHW4koTRWA2p6A_GBFdyTaz"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Built files have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be re-checked, or updates never reach phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
